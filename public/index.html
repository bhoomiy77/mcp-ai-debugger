<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MCP AI Debugger</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body>

    <div class="main-layout">

        
        <div class="left-panel">

            <div class="card">

                <h1>MCP CRUD APP</h1>

                <p class="subtitle">
                    AI Powered Auto Bug Fixing
                </p>

                <div class="form-section">

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter Name"
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                    >

                    <button onclick="addUsers()">
                        Add User
                    </button>

                </div>

                <div id="userList"></div>

            </div>

        </div>

        
        <div class="right-panel">

            <div class="chat-card">

                
                <div class="chat-header">

                    <h2>AI Debug Assistant</h2>

                </div>

            
                <div
                    id="chatBox"
                    class="chat-box"
                >

                    <div class="bot-message">

                        Hello 
                        <br><br>

                        Describe your bug and I will:
                        <br><br>

                        Detect the issue
                        <br>
                        Fix the bug
                        <br>
                         Update project automatically

                    </div>

                </div>

                
                <div class="chat-input-area">

                    <input
                        type="text"
                        id="userInput"
                        placeholder="Describe your bug..."
                    >

                    <button onclick="sendMessage()">
                        Send
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
